name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege: fork PRs never get write scopes. The publish job that
# creates GitHub releases scopes `contents: write` at the job level only.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential cmake g++ \
            libomp-dev libcurl4-openssl-dev \
            python3 python3-pip

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload terllama binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terllama-${{ github.sha }}
          path: build/terllama
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            arch: aarch64
          - os: macos-latest
            target: darwin-amd64
            arch: x86_64
          - os: macos-latest
            target: darwin-arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake g++ libomp-dev

      - name: Install deps (macOS)
        if: runner.os == 'MacOS'
        run: |
          brew install cmake libomp

      - name: Install Rust (tokenizer .so)
        run: |
          if ! command -v cargo &>/dev/null; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
            source "$HOME/.cargo/env"
          fi
          rustc --version && cargo --version

      - name: Build GigaToken tokenizer (.so)
        run: |
          source "$HOME/.cargo/env"
          (cd third_party/gigatoken-capi && cargo build --release -p gigatoken-capi)

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Assemble release bundle
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ github.ref_name }}"
          BUNDLE="terllama-${VER}-${{ matrix.target }}"
          mkdir -p "$BUNDLE/bin" "$BUNDLE/share/terllama/web"
          for t in terllama terllama-bench terllama-worker terllama-cluster terllama-node; do
            if [ -f "build/$t" ]; then
              cp "build/$t" "$BUNDLE/bin/"
            fi
          done
          cp build/libgigatoken_rs.so "$BUNDLE/bin/" 2>/dev/null || true
          cp build/libgigatoken_rs.dylib "$BUNDLE/bin/" 2>/dev/null || true
          cp web/index.html web/network.js web/anime.min.js "$BUNDLE/share/terllama/web/"
          cp install.sh uninstall.sh "$BUNDLE/"
          tar -czf "terllama-${VER}-${{ matrix.target }}.tar.gz" "$BUNDLE"
          ls -la *.tar.gz

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terllama-${{ matrix.target }}
          path: '*.tar.gz'

  publish:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      # Tarballs come from the matrix; installers/web assets live in the
      # repo checkout so we attach a single canonical copy (avoids the
      # duplicate-asset-name collisions softprops hits with 4x install.sh).
      - name: Stage release files
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/terllama-*/terllama-*.tar.gz release/ || true
          cp install.sh uninstall.sh release/
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          update_release: true
          generate_release_notes: true
