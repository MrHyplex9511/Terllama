name: Desktop Release
on:
  push:
    tags: ['desktop-v*']

# Tag-triggered only; still scope write to the publish job, not the workflow.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: terllama-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # GigaToken is a gitignored nested repo (not a submodule), so the CI
      # checkout does not contain it — clone the pinned revision explicitly.
      - name: Fetch GigaToken (pinned)
        run: |
          git clone --quiet https://github.com/marcelroed/gigatoken.git third_party/gigatoken
          git -C third_party/gigatoken checkout --quiet 34a1599
          # Its Cargo.toml uses per-profile rustflags, which current nightly
          # cargo requires an explicit cargo-features opt-in for. Portable
          # first-line insert (BSD sed on macOS cannot do GNU `sed -i 1i`).
          { printf 'cargo-features = ["profile-rustflags"]\n'; cat third_party/gigatoken/Cargo.toml; } \
            > third_party/gigatoken/Cargo.toml.patched
          mv third_party/gigatoken/Cargo.toml.patched third_party/gigatoken/Cargo.toml
          head -3 third_party/gigatoken/Cargo.toml

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # GigaToken embeds CPython (pyo3 abi3-py310) — the link needs the
          # unversioned libpython3.12.so, provided by the -dev package.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            rpm \
            cmake \
            libcurl4-openssl-dev \
            libpython3.12-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake libomp python@3.12

      # The C++ engine is Unix-only (Linux + macOS). Build it and place it
      # where the Tauri bundle will pick it up as a resource. The GigaToken
      # tokenizer is a Rust cdylib — build it too, since tauri.conf.json
      # bundles resources/bin/libgigatoken_rs.so.
      - name: Build engine (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARK=OFF -DBUILD_TESTING=OFF
          cmake --build build-release -j2 --target terllama
          mkdir -p terllama-desktop/src-tauri/resources/bin
          cp build-release/terllama terllama-desktop/src-tauri/resources/bin/terllama
          # GigaToken uses #![feature(portable_simd)] — needs nightly cargo.
          rustup toolchain install nightly --profile minimal
          PYO3_PYTHON=$(command -v python3.12) \
          cargo +nightly build --release -p gigatoken \
            --manifest-path third_party/gigatoken/Cargo.toml
          cp third_party/gigatoken/target/release/libgigatoken_rs.so \
             terllama-desktop/src-tauri/resources/bin/libgigatoken_rs.so

      - name: Build engine (macOS)
        if: runner.os == 'macOS'
        run: |
          # libomp is keg-only: point CMake at it so OpenMP is enabled.
          export CPPFLAGS="-I$(brew --prefix libomp)/include"
          export LDFLAGS="-L$(brew --prefix libomp)/lib"
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARK=OFF -DBUILD_TESTING=OFF
          cmake --build build-release -j2 --target terllama
          mkdir -p terllama-desktop/src-tauri/resources/bin
          cp build-release/terllama terllama-desktop/src-tauri/resources/bin/terllama
          # GigaToken uses #![feature(portable_simd)] — needs nightly cargo.
          rustup toolchain install nightly --profile minimal
          PYO3_PYTHON="$(brew --prefix python@3.12)/bin/python3.12" \
          cargo +nightly build --release -p gigatoken \
            --manifest-path third_party/gigatoken/Cargo.toml
          cp third_party/gigatoken/target/release/libgigatoken_rs.so \
             terllama-desktop/src-tauri/resources/bin/libgigatoken_rs.so

      - name: Build
        run: |
          cd terllama-desktop
          npm ci
          npm run tauri build

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terllama-desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            terllama-desktop/src-tauri/target/release/bundle/**/*.deb
            terllama-desktop/src-tauri/target/release/bundle/**/*.rpm
            terllama-desktop/src-tauri/target/release/bundle/**/*.AppImage
            terllama-desktop/src-tauri/target/release/bundle/**/*.msi
            terllama-desktop/src-tauri/target/release/bundle/**/*.exe
            terllama-desktop/src-tauri/target/release/bundle/**/*.dmg

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
