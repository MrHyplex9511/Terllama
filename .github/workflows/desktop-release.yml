name: Desktop Release
on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: terllama-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            rpm \
            cmake \
            libcurl4-openssl-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake libomp

      # The C++ engine is Unix-only (Linux + macOS). Build it and place it
      # where the Tauri bundle will pick it up as a resource.
      - name: Build engine (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARK=OFF -DBUILD_TESTING=OFF
          cmake --build build-release -j2 --target terllama
          mkdir -p terllama-desktop/src-tauri/resources/bin
          cp build-release/terllama terllama-desktop/src-tauri/resources/bin/terllama

      - name: Build engine (macOS)
        if: runner.os == 'macOS'
        run: |
          # libomp is keg-only: point CMake at it so OpenMP is enabled.
          export CPPFLAGS="-I$(brew --prefix libomp)/include"
          export LDFLAGS="-L$(brew --prefix libomp)/lib"
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARK=OFF -DBUILD_TESTING=OFF
          cmake --build build-release -j2 --target terllama
          mkdir -p terllama-desktop/src-tauri/resources/bin
          cp build-release/terllama terllama-desktop/src-tauri/resources/bin/terllama

      - name: Build
        run: |
          cd terllama-desktop
          npm ci
          npm run tauri build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: terllama-desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            terllama-desktop/src-tauri/target/release/bundle/**/*.deb
            terllama-desktop/src-tauri/target/release/bundle/**/*.rpm
            terllama-desktop/src-tauri/target/release/bundle/**/*.AppImage
            terllama-desktop/src-tauri/target/release/bundle/**/*.msi
            terllama-desktop/src-tauri/target/release/bundle/**/*.exe
            terllama-desktop/src-tauri/target/release/bundle/**/*.dmg

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
